<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="crispEdges">
<!--
  qci-obs APP MARK — 1024x1024

  OBS's identity is a CIRCLE; QC's is a PIXEL GRID. The blend keeps both literally: a ring
  of discrete LEDs stands in for OBS's round mark, and QC sits inside it drawn from his
  canonical 14x12 grid — transcribed from the qci core's render.py _QC, never redrawn by eye.
  qci-react.svg records why: "every previous attempt at redrawing him by eye came out the
  wrong shape", so this file takes the grid as data.

  The ring is not decoration. It is the rig's own LED-field motif (discrete cells, never a
  gradient), and the bright arc is the record sweep — OBS's swirl said in our vocabulary.

  Green #22c55e and yellow #ffe82c are RESERVED for QC and appear nowhere else here. The
  visualiser already made the opposite mistake once, painting the mascot in his own
  background colour until he vanished into it.
-->

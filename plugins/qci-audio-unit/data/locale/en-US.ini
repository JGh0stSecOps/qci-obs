; qci-audio-unit locale.
;
; Unlike the sibling qci-vision-person module — whose display name is a contract with
; qci-rig/lib/provision.mjs and therefore stays an English literal in the source — this filter
; has no rig dependency, so its strings go through obs_module_text() normally.
;
; The filter ID "qci_audio_unit" is NOT a translated string and must never change: it is what a
; saved scene collection stores, and renaming it orphans every filter the operator has added.
AudioUnit.Filter="Audio Unit"
AudioUnit.Effect="Effect"
AudioUnit.None="{Select an effect}"
AudioUnit.OpenInterface="Open plug-in interface"
; Split into a prefix and a value rather than a format string: a locale file is data, and passing
; a translated string to snprintf as the format is undefined behaviour the moment a translator
; drops the conversion specifier.
AudioUnit.LatencyPrefix="Reported plug-in latency:"
AudioUnit.LatencyUnknown="no effect loaded"

; qci-vision-person locale.
;
; This file exists so obs_module_set_locale() has something to load. Without a
; locale/en-US.ini in the module's Resources, obs_module_load_locale() logs
;   "Failed to load 'en-US' text for module: 'qci-vision-person'"
; (libobs/obs-module.c:882) on every launch.
;
; It is DELIBERATELY not wired into the filter's strings. vision-person-mask.mm
; passes English literals straight to obs_properties_add_* and returns a literal
; from get_name, and that is the correct behaviour here rather than an oversight:
; the display name "Person Mask (Vision)" is the name qci-rig/lib/provision.mjs
; creates and looks the filter up by, and it is what OBS pre-fills when the
; operator adds the filter by hand. A translated get_name would make those two
; disagree on a machine set to any other language, and a filter the rig cannot
; find is a filter the rig will happily recreate — leaving two masks, or none.
;
; The keys below therefore document the UI strings; they are not consumed.
VisionPerson.Filter="Person Mask (Vision)"
VisionPerson.Quality="Quality"
VisionPerson.Quality.Fast="Fast (live video)"
VisionPerson.Quality.Balanced="Balanced"
VisionPerson.Quality.Accurate="Accurate"
VisionPerson.Threshold="Mask threshold"
VisionPerson.Despeckle="Despeckle (kill false positives)"
VisionPerson.FgBlock="Person block size (px)"
VisionPerson.BgBlock="Background block size (px)"
VisionPerson.Levels="Color levels"
VisionPerson.Noise="Temporal noise"
VisionPerson.Lowlight="Low-light lift (night)"
VisionPerson.Blackpoint="Black point (kills grey haze)"

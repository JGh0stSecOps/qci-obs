Error.SystemExtension.NotInstalled.MacOS15="The virtual camera is not installed.\n\nPlease allow QCi Studio to install the camera system extension in System Settings → General → Login Items & Extensions → Camera Extensions.\n\nYou may need to restart QCi Studio if this message still appears afterwards."
Error.SystemExtension.WrongLocation="QCi Studio cannot install the virtual camera if it's not in \"/Applications\". Please move QCi Studio to the \"/Applications\" directory."
Error.SystemExtension.CompleteAfterReboot="The installation of the virtual camera will be completed after a system reboot."

SourceLeak.Text="Vandamál kom upp þegar skipt var um senusafn og ekki var hægt að afhlaða sumum heimildum. Þetta vandamál stafar venjulega af viðbótum sem gefa ekki út auðlindir á réttan hátt. Gakktu úr skugga um að allar viðbætur sem þú notar séu uppfærðar.\n\nQCi Studio mun nú hætta til að koma í veg fyrir hugsanlega gagnaspillingu."
